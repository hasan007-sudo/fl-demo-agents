[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-starter-python"
version = "1.0.0"
description = "Simple voice AI assistant built with LiveKit Agents for Python"
requires-python = ">=3.10"

dependencies = [
    "livekit-agents[cartesia,deepgram,google,inworld,liveavatar,openai,sarvam,silero,simli,turn-detector]~=1.3.6",
    "livekit-plugins-noise-cancellation~=0.2.5",
    "python-dotenv",
    # Langfuse observability
    "langfuse>=2.0",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "deepeval>=2.0.0",
    "livekit-plugins-liveavatar>=1.3.9",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
